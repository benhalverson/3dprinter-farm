name: Node.js CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@latest-10
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run checks
        run: pnpm run check
      - name: Run tests
        run: pnpm run test:ci
      - name: Run project notes tests
        run: pnpm test:project-notes
      - name: Install authentication acceptance browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify Lulu browser authentication
        run: pnpm test:auth-browser
      - name: Check out the reviewed Lulu cart handoff
        uses: actions/checkout@v4
        with:
          repository: benhalverson/luluspeedworks
          ref: dba226387e9a58a441be13a19c1c7ed02bea2c5f
          path: .generated/lulu-client
      - name: Use the pinned Lulu Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install the pinned Lulu dependencies
        run: pnpm --dir .generated/lulu-client install --frozen-lockfile
      - name: Verify the Lulu UI and native API cart handoff
        run: pnpm test:lulu-browser
        env:
          LULU_CLIENT_DIR: .generated/lulu-client

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@latest-10
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply remote database migrations
        run: pnpm run db:migrate:remote
      - name: Deploy Worker
        run: pnpm run deploy
